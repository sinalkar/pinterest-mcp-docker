[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pinterest-mcp"
version = "0.1.0"
description = "MCP server for Pinterest API v5 — create pins, manage boards, track analytics"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "pinterest", "ai", "model-context-protocol", "social-media"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
pinterest-mcp = "pinterest_mcp.server:main"
pinterest-mcp-auth = "pinterest_mcp.auth:run_auth_flow"

[project.urls]
Homepage = "https://github.com/clugtu/pinterest-mcp"
Repository = "https://github.com/clugtu/pinterest-mcp"
Issues = "https://github.com/clugtu/pinterest-mcp/issues"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
