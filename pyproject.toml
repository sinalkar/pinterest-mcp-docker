[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pinterest-mcp-docker"
dynamic = ["version"]
description = "Hardened, containerized MCP server for Pinterest API v5 — create pins, manage boards, track analytics"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "pinterest", "ai", "model-context-protocol", "social-media", "docker"]
# Original author of the upstream project this fork derives from.
authors = [{ name = "Carlos Lugtu" }]
maintainers = [{ name = "sanjay s" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.9.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "anyio>=4.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
]

[project.optional-dependencies]
http = [
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
]
dev = [
    "pinterest-mcp-docker[http]",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
]

[project.scripts]
pinterest-mcp = "pinterest_mcp.server:main"
pinterest-mcp-auth = "pinterest_mcp.auth:run_auth_flow"

[project.urls]
Homepage = "https://github.com/sinalkar/pinterest-mcp-docker"
Repository = "https://github.com/sinalkar/pinterest-mcp-docker"
Issues = "https://github.com/sinalkar/pinterest-mcp-docker/issues"
Changelog = "https://github.com/sinalkar/pinterest-mcp-docker/blob/main/CHANGELOG.md"
Upstream = "https://github.com/clugtu/pinterest-mcp"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"
fallback_version = "0.1.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/pinterest_mcp/_version.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "LICENSE", "NOTICE.md", "README.md", "CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/pinterest_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"LICENSE" = "pinterest_mcp/LICENSE"
"NOTICE.md" = "pinterest_mcp/NOTICE.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests; enforced by bandit elsewhere

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.coverage.run]
source = ["src/pinterest_mcp"]
branch = true
