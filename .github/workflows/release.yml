name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  check-credentials:
    name: Check Required Release Credentials
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Verify Docker Hub & PyPI Credentials
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYTHON_PUBLISH_TOKEN }}
        run: |
          MISSING=""
          if [ -z "$DH_USER" ]; then MISSING="$MISSING DOCKERHUB_USERNAME"; fi
          if [ -z "$DH_TOKEN" ]; then MISSING="$MISSING DOCKERHUB_TOKEN"; fi
          if [ -z "$PYPI_TOKEN" ]; then MISSING="$MISSING PYTHON_PUBLISH_TOKEN"; fi
          if [ -n "$MISSING" ]; then
            echo "Error: Missing required release credentials:$MISSING" >&2
            exit 1
          fi

  publish-docker:
    name: Build & Publish Container Images
    needs: check-credentials
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_USERNAME }}/pinterest-mcp-docker
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build and Push Multi-Arch Image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Sign Container Images with Cosign
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"
          cosign sign --yes "${{ secrets.DOCKERHUB_USERNAME }}/pinterest-mcp-docker@${DIGEST}"

  publish-pypi:
    name: Publish Python Package to PyPI
    needs: publish-docker
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Package
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYTHON_PUBLISH_TOKEN }}

  github-release:
    name: Create GitHub Release
    needs: [publish-docker, publish-pypi]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          generate_release_notes: true
