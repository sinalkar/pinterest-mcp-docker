name: Release

'on':
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.2.0 (needed because tags pushed with GITHUB_TOKEN do not auto-trigger this workflow)'
        required: true

permissions:
  contents: read

jobs:
  resolve-tag:
    name: Resolve Release Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      major: ${{ steps.resolve.outputs.major }}
      major_minor: ${{ steps.resolve.outputs.major_minor }}
    steps:
      - name: Resolve tag and version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must be in vX.Y.Z format (got '$TAG')" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"

  check-credentials:
    name: Check Required Release Credentials
    needs: resolve-tag
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Verify Docker Hub & PyPI Credentials
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYTHON_PUBLISH_TOKEN }}
        run: |
          MISSING=""
          if [ -z "$DH_USER" ]; then MISSING="$MISSING DOCKERHUB_USERNAME"; fi
          if [ -z "$DH_TOKEN" ]; then MISSING="$MISSING DOCKERHUB_TOKEN"; fi
          if [ -z "$PYPI_TOKEN" ]; then MISSING="$MISSING PYTHON_PUBLISH_TOKEN"; fi
          if [ -n "$MISSING" ]; then
            echo "Error: Missing required release credentials:$MISSING" >&2
            exit 1
          fi

  publish-docker:
    name: Build & Publish Container Images
    needs: [resolve-tag, check-credentials]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
          fetch-depth: 0

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_USERNAME }}/pinterest-mcp-docker
          tags: |
            type=raw,value=${{ needs.resolve-tag.outputs.version }}
            type=raw,value=${{ needs.resolve-tag.outputs.major_minor }}
            type=raw,value=${{ needs.resolve-tag.outputs.major }}
            type=raw,value=latest

      - name: Build and Push Multi-Arch Image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Sign Container Images with Cosign
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"
          if [ -n "$DH_USER" ]; then
            cosign sign --yes "${DH_USER}/pinterest-mcp-docker@${DIGEST}"
          fi

      - name: Update Docker Hub Description
        if: env.DOCKERHUB_USERNAME != ''
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/pinterest-mcp-docker
          short-description: "Hardened, containerized MCP server for Pinterest API v5 — pins, boards, analytics"
          readme-filepath: ./README.md

  publish-pypi:
    name: Publish Python Package to PyPI
    needs: [resolve-tag, publish-docker]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Package
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYTHON_PUBLISH_TOKEN }}

  github-release:
    name: Create GitHub Release
    needs: [resolve-tag, publish-docker, publish-pypi]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
          fetch-depth: 0

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          body_path: CHANGELOG.md
          generate_release_notes: true
