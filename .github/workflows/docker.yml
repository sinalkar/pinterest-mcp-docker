name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'src/**'
      - '.github/workflows/docker.yml'

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Scan & Smoke Test Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@369d80d8b02dfe3416921832ed5d8e68c0b9a9a3 # v5.5.1
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Build image for testing
        uses: docker/build-push-action@48aba3b46d1b1fec4fedd7c5d0c644b749a4ef4d # v6.10.0
        with:
          context: .
          load: true
          tags: pinterest-mcp-docker:test

      - name: Smoke Test (stdio mode)
        run: |
          docker run --rm -i pinterest-mcp-docker:test --help || true

      - name: Smoke Test (HTTP mode & /healthz)
        run: |
          docker run -d --name test-http -p 8080:8080 -e MCP_TRANSPORT=http -e MCP_HOST=0.0.0.0 -e MCP_AUTH_TOKEN=test-secret pinterest-mcp-docker:test
          sleep 3
          curl -f http://127.0.0.1:8080/healthz || (docker logs test-http && exit 1)
          docker rm -f test-http

      - name: Trivy Image Scan (SARIF Report)
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394d2dd8c87dbb0 # v0.29.0
        with:
          image-ref: 'pinterest-mcp-docker:test'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          exit-code: '0'

      - name: Upload Trivy Image SARIF
        uses: github/codeql-action/upload-sarif@dd7440b688e8d408d9d336bb6931380efb7bfb2f # v3.28.3
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: 'trivy-image'

      - name: Build and Push (on push main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@48aba3b46d1b1fec4fedd7c5d0c644b749a4ef4d # v6.10.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
