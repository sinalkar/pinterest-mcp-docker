name: Create Release Tag

'on':
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.1 (leave empty to auto-increment)'
        required: false
        default: ''
      bump:
        description: 'Bump type if version is left empty'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  actions: write

jobs:
  tag-and-release:
    name: Create Tag & Trigger Release Workflow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next release tag
        id: calc
        run: |
          INPUT_VER="${{ github.event.inputs.version }}"
          BUMP="${{ github.event.inputs.bump }}"

          if [ -n "$INPUT_VER" ]; then
            CLEAN_VER="${INPUT_VER#v}"
            if ! [[ "$CLEAN_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version must be in x.y.z format (got '$INPUT_VER')" >&2
              exit 1
            fi
            TAG="v${CLEAN_VER}"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            V_NUM="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$V_NUM"
            MAJOR=${MAJOR:-0}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}

            if [ "$BUMP" = "major" ]; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
            elif [ "$BUMP" = "minor" ]; then
              MINOR=$((MINOR + 1))
              PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi
            TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "Calculated tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          TAG: ${{ steps.calc.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Trigger Release Workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.calc.outputs.tag }}
        run: |
          echo "Triggering release workflow for $TAG..."
          gh workflow run release.yml -f tag="$TAG"

