services:
  pinterest-mcp:
    image: sinalkar/pinterest-mcp-docker:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pinterest-mcp
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - pinterest_token_data:/home/app/.local/state/pinterest-mcp
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8080/healthz\")'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  pinterest_token_data:
    name: pinterest_token_data
